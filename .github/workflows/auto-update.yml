name: Sync prebuilt Codex Desktop

on:
  schedule:
    # Runs 30 minutes after the source repository's six-hour release check.
    - cron: "53 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Republish even when this exact package asset already exists
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-arch-repo-x86_64
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:base-devel
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install verification and publishing tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm curl github-cli gnupg jq nodejs

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and verify latest package release
        id: package
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          SOURCE_REPOSITORY: JuckZ/codex-desktop-bin
          TARGET_RELEASE_TAG: repository-x86_64
          TARGET_REPOSITORY: ${{ github.repository }}
        run: ./scripts/fetch-codex-release.sh

      - name: Create publishing user and import signing key
        if: steps.package.outputs.publish == 'true'
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -m 0700 -o builder -g builder /home/builder/.gnupg
          printf '%s' "$REPO_GPG_PRIVATE_KEY" | runuser -u builder -- gpg --batch --import

      - name: Sign and publish package to juckz repository
        if: steps.package.outputs.publish == 'true'
        env:
          REPO_GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          runuser -u builder -- env \
            GH_TOKEN="$GH_TOKEN" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            REPO_GPG_KEY_ID="$REPO_GPG_KEY_ID" \
            bash "$GITHUB_WORKSPACE/scripts/publish-repo.sh" \
              "${{ steps.package.outputs.package_path }}"

      - name: Summary
        run: |
          if [ "${{ steps.package.outputs.publish }}" = true ]; then
            printf '### Published codex-desktop %s\n\n' '${{ steps.package.outputs.package_version }}' >> "$GITHUB_STEP_SUMMARY"
            printf 'OpenAI app: `%s`\n\n' '${{ steps.package.outputs.upstream_version }}' >> "$GITHUB_STEP_SUMMARY"
            printf 'Install: `sudo pacman -Syu juckz/codex-desktop`\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### No repository update needed\n' >> "$GITHUB_STEP_SUMMARY"
          fi
